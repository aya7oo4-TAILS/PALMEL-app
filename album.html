<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PARMEL - ALBUM</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0b0d0e;
      --card-bg: linear-gradient(135deg, #24292e 0%, #16181b 100%);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-shadow: 0 12px 32px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      --text-main: #f5f6f8;
      --text-sub: #9aa0a6;
      --gold: #e5c07b;
      --radius-card: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    
    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg-main);
      color: var(--text-main);
      font-family: 'Noto Sans JP', sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 12px 12px 80px;
    }

    .app-viewport {
      width: 100%;
      max-width: 414px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .page-header {
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      letter-spacing: 0.2em;
      color: var(--gold);
      text-align: center;
      margin-top: 8px;
      margin-bottom: 4px;
    }

    /* アルバムグリッド（3列表示） */
    .album-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
    }

    .album-item {
      background: #15181b;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      aspect-ratio: 1 / 1.25;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .album-label {
      font-family: 'Cinzel', 'Noto Sans JP', serif;
      font-size: 0.58rem;
      letter-spacing: 0.1em;
      text-align: center;
      padding: 5px 2px;
      background: rgba(0, 0, 0, 0.5);
      color: var(--text-sub);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .album-image-box {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      background: #101214;
    }

    .album-image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .album-image-box img.has-image {
      display: block;
    }

    /* 未登録時のプレースホルダーアイコン */
    .album-placeholder {
      color: rgba(255, 255, 255, 0.2);
      font-size: 1.2rem;
    }

    /* 右下「NOSE＋PALMEL」専用のデザイン演出 */
    .album-item.palmel-item .album-image-box img.has-image {
      filter: brightness(0.45);
    }

    .palmel-overlay-logo {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 5;
      pointer-events: none;
      font-family: 'Cinzel', serif;
      letter-spacing: 0.15em;
      color: rgba(255, 255, 255, 0.95);
      text-shadow: 0 0 10px rgba(229, 192, 123, 0.6), 0 0 20px rgba(229, 192, 123, 0.3);
      font-size: 0.8rem;
      font-weight: 700;
      text-align: center;
      padding: 0 2px;
    }

    .palmel-overlay-sub {
      font-size: 0.38rem;
      letter-spacing: 0.25em;
      color: var(--gold);
      margin-top: 2px;
      opacity: 0.85;
    }

    /* ボトムナビゲーション */
    .bottom-nav {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 414px; height: 60px;
      background: rgba(15, 17, 20, 0.95); backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex; justify-content: space-around; align-items: center; z-index: 99999;
    }
    .nav-btn { background: none; border: none; color: var(--text-sub); display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 0.62rem; cursor: pointer; width: 25%; text-decoration: none; }
    .nav-btn.active { color: var(--gold); }
  </style>
</head>
<body>

  <div class="app-viewport">
    <div class="page-header">MEMORY ALBUM</div>

    <!-- 9マスアルバムグリッド -->
    <div class="album-grid" id="album-grid-container">
      <!-- JavaScript動的生成 -->
    </div>
  </div>

  <!-- ボトムナビゲーション -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-btn" id="btn-mypal">MYPAL</a>
    <a href="album.html" class="nav-btn active" id="btn-album">ALBUM</a>
    <a href="palrium.html" class="nav-btn" id="btn-exchange">PALRIUM</a>
    <a href="pals.html" class="nav-btn" id="btn-feed">PALS</a>
  </nav>

  <script>
    const STORAGE_KEY = 'parmel_grid_data';
    const defaultLabels = ['MONTHLY', 'CHARMPOINT', 'FREE', 'FOOD', 'MAIN', 'SLEEPING', 'TOYS', 'FUNNYSHOT', 'NOSE＋PALMEL'];

    function renderAlbum() {
      const container = document.getElementById('album-grid-container');
      container.innerHTML = '';

      // ローカルストレージからホーム画面と同期されたデータを取得
      let savedData = { images: Array(9).fill(''), freeLabel: 'FREE' };
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed.images) savedData.images = parsed.images;
          if (parsed.freeLabel) savedData.freeLabel = parsed.freeLabel;
        }
      } catch (e) {
        console.error('Failed to load storage data', e);
      }

      defaultLabels.forEach((label, i) => {
        const currentLabel = (i === 2) ? (savedData.freeLabel || 'FREE') : label;
        const imgSrc = savedData.images[i] || '';
        const isPalmel = (i === 8);
        const palmelClass = isPalmel ? ' palmel-item' : '';
        const hasImgClass = imgSrc ? ' has-image' : '';

        const palmelOverlayHtml = isPalmel ? `
          <div class="palmel-overlay-logo">
            PALMEL
            <span class="palmel-overlay-sub">SPECIAL</span>
          </div>
        ` : '';

        const placeholderHtml = !imgSrc && !isPalmel ? `<div class="album-placeholder">📷</div>` : '';

        const itemHtml = `
          <div class="album-item${palmelClass}">
            <div class="album-label">${currentLabel}</div>
            <div class="album-image-box">
              ${placeholderHtml}
              <img src="${imgSrc}" class="${hasImgClass}" alt="${currentLabel}">
              ${palmelOverlayHtml}
            </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', itemHtml);
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderAlbum();
    });

    // 別タブやホーム画面等でストレージが更新された時に即時反映させる
    window.addEventListener('storage', (e) => {
      if (e.key === STORAGE_KEY) {
        renderAlbum();
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PARMEL - ALBUM</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0b0d0e;
      --card-bg: linear-gradient(135deg, #24292e 0%, #16181b 100%);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-shadow: 0 12px 32px rgba(0, 0, 0, 0.7);
      --text-main: #f5f6f8;
      --text-sub: #9aa0a6;
      --gold: #e5c07b;
      --radius-card: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    
    html, body {
      width: 100%; height: 100%; background: var(--bg-main); color: var(--text-main); font-family: 'Noto Sans JP', sans-serif; overflow-x: hidden; overflow-y: auto;
    }

    body {
      display: flex; justify-content: center; padding: 12px 12px 80px;
    }

    .app-viewport {
      width: 100%; max-width: 414px; display: flex; flex-direction: column; gap: 16px;
    }

    .header-area {
      display: flex; justify-content: space-between; align-items: center; padding: 8px 4px;
    }

    .page-title {
      font-family: 'Cinzel', serif; font-size: 1.1rem; letter-spacing: 0.1em; color: var(--gold);
    }

    .save-action-btn {
      background: var(--gold); color: #0b0d0e; border: none; border-radius: 8px; padding: 8px 16px; font-size: 0.75rem; font-weight: bold; cursor: pointer;
    }
    .save-action-btn:active { opacity: 0.8; }

    .preview-section {
      background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius-card); padding: 12px; box-shadow: var(--card-shadow); display: flex; flex-direction: column; gap: 10px;
    }

    .preview-date-label {
      font-size: 0.7rem; color: var(--gold); letter-spacing: 0.05em; text-align: center; font-weight: 500;
    }

    .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; }
    .grid-item { background: #15181b; border-radius: 8px; display: flex; flex-direction: column; aspect-ratio: 1 / 1.25; position: relative; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.04); }
    .grid-label { font-family: 'Cinzel', 'Noto Sans JP', serif; font-size: 0.58rem; letter-spacing: 0.1em; text-align: center; padding: 4px 2px; background: rgba(0, 0, 0, 0.4); color: var(--text-sub); display: flex; align-items: center; justify-content: center; }

    .grid-image-box { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; background: #101214; }
    .grid-image-box img { width: 100%; height: 100%; object-fit: cover; }

    .grid-number-box { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1b2025 0%, #101214 100%); }
    .styled-number { font-family: 'Cinzel', serif; font-size: 2.8rem; font-weight: 500; color: var(--gold); opacity: 0.85; }

    .history-section { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
    .section-subtitle { font-family: 'Cinzel', serif; font-size: 0.85rem; color: var(--text-sub); letter-spacing: 0.08em; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 6px; }

    .history-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .history-card-header { display: flex; justify-content: space-between; align-items: center; }
    .history-date { font-size: 0.75rem; color: var(--gold); font-weight: bold; }
    .history-delete-btn { background: none; border: none; color: #ff6b6b; font-size: 0.65rem; cursor: pointer; }

    .history-grid-thumb { display: grid; grid-template-columns: repeat(9, 1fr); gap: 3px; }
    .thumb-cell { aspect-ratio: 1; background: #111; border-radius: 3px; overflow: hidden; }
    .thumb-cell img { width: 100%; height: 100%; object-fit: cover; }

    .bottom-nav {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 414px; height: 60px;
      background: rgba(15, 17, 20, 0.95); backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex; justify-content: space-around; align-items: center; z-index: 99999;
    }
    .nav-btn { background: none; border: none; color: var(--text-sub); display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 0.62rem; cursor: pointer; width: 25%; text-decoration: none; }
    .nav-btn.active { color: var(--gold); }
  </style>
</head>
<body>

  <div class="app-viewport">
    <div class="header-area">
      <h1 class="page-title">ALBUM</h1>
      <button class="save-action-btn" onclick="saveCurrentAlbum()">今の状態を保存</button>
    </div>

    <div class="preview-section">
      <div class="preview-date-label" id="current-preview-date">本日のプレビュー</div>
      <div class="grid-container" id="preview-grid-container"></div>
    </div>

    <div class="history-section">
      <h2 class="section-subtitle">SAVED HISTORY</h2>
      <div id="history-list-container"></div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-btn" id="btn-mypal">MYPAL</a>
    <a href="album.html" class="nav-btn active" id="btn-album">ALBUM</a>
    <a href="palrium.html" class="nav-btn" id="btn-exchange">PALRIUM</a>
    <a href="pals.html" class="nav-btn" id="btn-feed">PALS</a>
  </nav>

  <script>
    const gridLabelsTemplate = ['MONTHLY', 'CHARMPOINT', 'FREE', 'FOOD', 'MAIN', 'SLEEPING', 'TOYS', 'FUNNYSHOT', 'PALMEL'];

    window.addEventListener('DOMContentLoaded', () => {
      updateCurrentPreview();
      renderHistory();
      const today = new Date();
      const dateStr = `${today.getFullYear()}.${String(today.getMonth() + 1).padStart(2, '0')}.${String(today.getDate()).padStart(2, '0')}`;
      document.getElementById('current-preview-date').innerText = `CURRENT PREVIEW (${dateStr})`;
    });

    function getCurrentGridData() {
      const savedData = localStorage.getItem('parmel_grid_data');
      if (savedData) {
        return JSON.parse(savedData);
      }
      let dummy = [];
      for(let i=0; i<9; i++) {
        dummy.push({ label: gridLabelsTemplate[i], image: '', isNumber: (i === 8) });
      }
      return dummy;
    }

    function updateCurrentPreview() {
      const container = document.getElementById('preview-grid-container');
      container.innerHTML = '';
      const gridData = getCurrentGridData();

      gridData.forEach((item, i) => {
        const div = document.createElement('div');
        div.className = 'grid-item';
        
        const labelDiv = document.createElement('div');
        labelDiv.className = 'grid-label';
        labelDiv.innerText = item.label || gridLabelsTemplate[i];
        div.appendChild(labelDiv);

        if (i === 8) {
          const numBox = document.createElement('div');
          numBox.className = 'grid-number-box';
          numBox.innerHTML = `<span class="styled-number">9</span>`;
          div.appendChild(numBox);
        } else {
          const imgBox = document.createElement('div');
          imgBox.className = 'grid-image-box';
          if (item.image) {
            imgBox.innerHTML = `<img src="${item.image}">`;
          }
          div.appendChild(imgBox);
        }
        container.appendChild(div);
      });
    }

    function saveCurrentAlbum() {
      const gridData = getCurrentGridData();
      const now = new Date();
      const dateString = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      const newAlbumEntry = {
        id: Date.now(),
        date: dateString,
        data: gridData
      };

      let history = JSON.parse(localStorage.getItem('parmel_album_history') || '[]');
      history.unshift(newAlbumEntry);
      localStorage.setItem('parmel_album_history', JSON.stringify(history));

      renderHistory();
      alert('現在の9マス状態をアルバムに保存しました！');
    }

    function renderHistory() {
      const container = document.getElementById('history-list-container');
      container.innerHTML = '';
      let history = JSON.parse(localStorage.getItem('parmel_album_history') || '[]');

      if (history.length === 0) {
        container.innerHTML = `<div style="font-size:0.7rem; color:var(--text-sub); text-align:center; padding: 20px;">保存されたアルバムはありません</div>`;
        return;
      }

      history.forEach(entry => {
        const card = document.createElement('div');
        card.className = 'history-card';

        let thumbsHtml = '';
        entry.data.forEach((item, i) => {
          if (i === 8) {
            thumbsHtml += `<div class="thumb-cell" style="background:var(--gold); display:flex; align-items:center; justify-content:center; font-size:0.4rem; color:#000; font-weight:bold;">9</div>`;
          } else {
            thumbsHtml += `<div class="thumb-cell"><img src="${item.image || ''}"></div>`;
          }
        });

        card.innerHTML = `
          <div class="history-card-header">
            <span class="history-date">📅 ${entry.date}</span>
            <button class="history-delete-btn" onclick="deleteHistory(${entry.id})">削除</button>
          </div>
          <div class="history-grid-thumb">
            ${thumbsHtml}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function deleteHistory(id) {
      if(!confirm('このアルバムデータを削除しますか？')) return;
      let history = JSON.parse(localStorage.getItem('parmel_album_history') || '[]');
      history = history.filter(item => item.id !== id);
      localStorage.setItem('parmel_album_history', JSON.stringify(history));
      renderHistory();
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PARMEL - ALBUM</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0b0d0e;
      --text-main: #f5f6f8;
      --text-sub: #9aa0a6;
      --gold: #e5c07b;
      --radius-card: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    
    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg-main);
      color: var(--text-main);
      font-family: 'Noto Sans JP', sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 12px 12px 80px;
    }

    .app-viewport {
      width: 100%;
      max-width: 414px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .page-title {
      font-family: 'Cinzel', serif;
      font-size: 0.9rem;
      letter-spacing: 0.2em;
      color: var(--gold);
      text-align: center;
      margin-top: 4px;
    }

    /* 9マス Grid */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      width: 100%;
    }

    .grid-item {
      background: #15181b;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      aspect-ratio: 1 / 1.25;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .grid-label {
      font-family: 'Cinzel', 'Noto Sans JP', serif;
      font-size: 0.58rem;
      letter-spacing: 0.1em;
      text-align: center;
      padding: 4px 2px;
      background: rgba(0, 0, 0, 0.4);
      color: var(--text-sub);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .grid-label-input {
      background: transparent;
      border: none;
      border-bottom: 1px dashed rgba(229, 192, 123, 0.5);
      color: var(--gold);
      font-family: inherit;
      font-size: 0.58rem;
      text-align: center;
      width: 90%;
      outline: none;
      letter-spacing: 0.05em;
      font-weight: bold;
    }
    .grid-label-input::placeholder { color: rgba(229, 192, 123, 0.4); }
    .grid-label-input:focus { border-bottom-color: var(--gold); background: rgba(0, 0, 0, 0.3); }

    .grid-image-box {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .grid-image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .grid-item.palmel-item .grid-image-box {
      position: relative;
    }

    .grid-item.palmel-item .grid-image-box img.has-image {
      filter: brightness(0.45);
    }

    .palmel-overlay-logo {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 5;
      pointer-events: none;
      font-family: 'Cinzel', serif;
      letter-spacing: 0.15em;
      color: rgba(255, 255, 255, 0.95);
      text-shadow: 0 0 10px rgba(229, 192, 123, 0.6), 0 0 20px rgba(229, 192, 123, 0.3);
      font-size: 0.8rem;
      font-weight: 700;
      text-align: center;
      padding: 0 2px;
    }

    input[type="file"] { display: none; }

    /* 保存ボタン */
    .save-btn-container {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 4px;
    }

    .save-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #e5c07b, #c8a25c);
      color: #0b0d0e;
      border: none;
      border-radius: 8px;
      font-family: 'Cinzel', 'Noto Sans JP', serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(229, 192, 123, 0.2);
      transition: all 0.2s ease;
    }

    .save-btn:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    .save-btn.saved {
      background: #2a2f35 !important;
      color: var(--text-sub) !important;
      cursor: default;
      box-shadow: none;
      transform: none;
    }

    /* 履歴セクション */
    .history-section {
      width: 100%;
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 20px;
    }

    .history-title {
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      color: var(--text-sub);
      text-align: center;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .history-card {
      background: #15181b;
      border-radius: 12px;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
    }

    .history-header {
      display: grid;
      grid-template-columns: 75px 1fr 75px;
      align-items: center;
      padding: 2px 0;
    }

    .history-delete-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 0.6rem;
      cursor: pointer;
      padding: 2px 4px;
      text-align: left;
    }
    .history-delete-btn:hover { color: #ff6b6b; }

    .history-date {
      text-align: center;
      font-size: 0.78rem;
      color: var(--gold);
      font-family: 'Cinzel', serif;
      letter-spacing: 0.08em;
      font-weight: 700;
    }

    .history-phone-save-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 0.6rem;
      cursor: pointer;
      padding: 2px 4px;
      text-align: right;
      justify-self: end;
    }
    .history-phone-save-btn:hover { color: var(--text-main); }

    /* 保存された履歴内のミニ9マスグリッド */
    .history-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      width: 100%;
      background: #15181b;
    }

    .history-grid-item {
      background: #0b0d0e;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      aspect-ratio: 1 / 1.25;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .history-grid-label {
      font-family: 'Cinzel', 'Noto Sans JP', serif;
      font-size: 0.48rem;
      letter-spacing: 0.05em;
      text-align: center;
      padding: 2px;
      background: rgba(0, 0, 0, 0.5);
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-grid-image-box {
      flex: 1;
      width: 100%;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .history-grid-image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .history-palmel-logo {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: rgba(255, 255, 255, 0.95);
      text-shadow: 0 0 8px rgba(229, 192, 123, 0.6);
      pointer-events: none;
    }
    .history-grid-item.palmel-item img.has-image {
      filter: brightness(0.45);
    }

    /* ボトムナビゲーション */
    .bottom-nav {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 414px; height: 60px;
      background: rgba(15, 17, 20, 0.95); backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex; justify-content: space-around; align-items: center; z-index: 99999;
    }
    .nav-btn { background: none; border: none; color: var(--text-sub); display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 0.62rem; cursor: pointer; width: 25%; text-decoration: none; }
    .nav-btn.active { color: var(--gold); }
  </style>
</head>
<body>

  <div class="app-viewport">
    <h1 class="page-title">ALBUM</h1>

    <!-- 9マス Grid -->
    <div class="grid-container">
      <script>
        const gridLabels = ['MONTHLY', 'CHARMPOINT', 'FREE', 'FOOD', 'MAIN', 'SLEEPING', 'TOYS', 'FUNNYSHOT', 'NOSE＋PALMEL'];
        
        gridLabels.forEach((lbl, i) => {
          const labelHtml = (i === 2)
            ? `<input type="text" id="custom-free-label" class="grid-label-input" value="FREE" placeholder="タイトル" maxlength="12">`
            : lbl;

          const isPalmel = (i === 8);
          const extraClass = isPalmel ? ' palmel-item' : '';
          const innerExtra = isPalmel ? `
            <div class="palmel-overlay-logo">
              PALMEL
            </div>
          ` : '';

          document.write(`
            <div class="grid-item${extraClass}">
              <div class="grid-label">${labelHtml}</div>
              <label class="grid-image-box">
                <img id="g${i}">
                ${innerExtra}
                <input type="file" accept="image/*" onchange="previewGrid(this, 'g${i}', ${isPalmel})">
              </label>
            </div>`);
        });
      </script>
    </div>

    <!-- 保存するボタン -->
    <div class="save-btn-container">
      <button id="save-album-btn" class="save-btn" onclick="saveAlbumToHistory()">アルバムに追加</button>
    </div>

    <!-- 過去に保存したアルバム一覧（下に蓄積） -->
    <div class="history-section">
      <h2 class="history-title">PALMEL MEMORY</h2>
      <div class="history-list" id="history-list-container">
        <!-- ここに保存されたアルバムがどんどん追加されます -->
      </div>
    </div>
  </div>

  <!-- ボトムナビゲーション -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-btn" id="btn-mypal">MYPAL</a>
    <a href="album.html" class="nav-btn active" id="btn-album">ALBUM</a>
    <a href="palrium.html" class="nav-btn" id="btn-exchange">PALRIUM</a>
    <a href="pals.html" class="nav-btn" id="btn-feed">PALS</a>
  </nav>

  <script>
    const STORAGE_KEY = 'parmel_grid_data';
    const HISTORY_KEY = 'parmel_album_history';
    const gridLabelsStatic = ['MONTHLY', 'CHARMPOINT', 'FREE', 'FOOD', 'MAIN', 'SLEEPING', 'TOYS', 'FUNNYSHOT', 'NOSE＋PALMEL'];

    // 現在の入力状態の自動保存
    function saveCurrentDraft() {
      const data = {
        images: [],
        freeLabel: document.getElementById('custom-free-label') ? document.getElementById('custom-free-label').value : 'FREE'
      };
      for (let i = 0; i < 9; i++) {
        const imgEl = document.getElementById(`g${i}`);
        data.images.push(imgEl ? imgEl.src : '');
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function loadCurrentDraft() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return;
        const data = JSON.parse(saved);
        if (data.images && Array.isArray(data.images)) {
          data.images.forEach((src, i) => {
            const img = document.getElementById(`g${i}`);
            if (img && src) {
              img.src = src;
              if (i === 8) img.classList.add('has-image');
            }
          });
        }
        if (data.freeLabel) {
          const freeInput = document.getElementById('custom-free-label');
          if (freeInput) freeInput.value = data.freeLabel;
        }
      } catch (e) {
        console.error('Failed to load draft', e);
      }
    }

    // 画像プレビュー時
    function previewGrid(input, imgId, isPalmel) {
      if (input.files && input.files[0]) {
        const r = new FileReader();
        r.onload = e => {
          const img = document.getElementById(imgId);
          img.src = e.target.result;
          if (isPalmel) img.classList.add('has-image');
          saveCurrentDraft();
        };
        r.readAsDataURL(input.files[0]);
      }
    }

    // 「アルバムに追加」ボタンを押したときの処理 ＋ エフェクト
    function saveAlbumToHistory() {
      const btn = document.getElementById('save-album-btn');
      if (btn.classList.contains('saved')) return;

      const freeLabelVal = document.getElementById('custom-free-label') ? document.getElementById('custom-free-label').value : 'FREE';
      
      const currentImages = [];
      for (let i = 0; i < 9; i++) {
        const imgEl = document.getElementById(`g${i}`);
        currentImages.push(imgEl ? imgEl.src : '');
      }

      const now = new Date();
      const dateStr = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')}`;

      const newAlbum = {
        id: Date.now(),
        date: dateStr,
        freeLabel: freeLabelVal,
        images: currentImages
      };

      let history = [];
      try {
        const savedHistory = localStorage.getItem(HISTORY_KEY);
        if (savedHistory) history = JSON.parse(savedHistory);
      } catch (e) {
        console.error(e);
      }

      history.unshift(newAlbum);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history));

      renderHistory();

      btn.classList.add('saved');
      btn.innerText = '追加されました！';

      setTimeout(() => {
        btn.classList.remove('saved');
        btn.innerText = 'アルバムに追加';
      }, 1500);
    }

    // 履歴を画面に描画
    function renderHistory() {
      const container = document.getElementById('history-list-container');
      container.innerHTML = '';

      let history = [];
      try {
        const savedHistory = localStorage.getItem(HISTORY_KEY);
        if (savedHistory) history = JSON.parse(savedHistory);
      } catch (e) {
        console.error(e);
      }

      if (history.length === 0) {
        container.innerHTML = `<div style="text-align: center; font-size: 0.65rem; color: var(--text-sub); padding: 10px;">追加されたアルバムはありません</div>`;
        return;
      }

      history.forEach(item => {
        const card = document.createElement('div');
        card.className = 'history-card';
        card.id = `history-card-${item.id}`;

        let gridHtml = '';
        item.images.forEach((imgSrc, i) => {
          const labelText = (i === 2) ? (item.freeLabel || 'FREE') : gridLabelsStatic[i];
          const isPalmel = (i === 8);
          const palmelClass = isPalmel ? ' palmel-item' : '';
          const palmelLogo = isPalmel ? `<div class="history-palmel-logo">PALMEL</div>` : '';
          const imgTag = imgSrc ? `<img src="${imgSrc}" class="has-image">` : `<img src="">`;

          gridHtml += `
            <div class="history-grid-item${palmelClass}">
              <div class="history-grid-label">${labelText}</div>
              <div class="history-grid-image-box">
                ${imgTag}
                ${palmelLogo}
              </div>
            </div>
          `;
        });

        card.innerHTML = `
          <div class="history-header">
            <button class="history-delete-btn" onclick="deleteHistoryItem(${item.id})">削除</button>
            <span class="history-date">${item.date}</span>
            <button class="history-phone-save-btn" onclick="saveToPhone(${item.id})">写真に保存</button>
          </div>
          <div class="history-grid" id="history-grid-${item.id}">
            ${gridHtml}
          </div>
        `;

        container.appendChild(card);
      });
    }

    // 写真に保存する機能（ブラウザの仕様上、各カードのグリッド画像をプレビューして長押し保存、あるいは簡易ダウンロードとして動作します）
    function saveToPhone(id) {
      let history = [];
      try {
        history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
      } catch (e) {}
      
      const item = history.find(h => h.id === id);
      if (!item) return;

      // 画像の長押し保存用の案内、または画像URLの直接生成に切り替え可能
      alert('「写真に保存」するには、表示されているアルバム画像を長押しして「写真に追加」を選択してください。');
    }

    // 履歴の削除
    function deleteHistoryItem(id) {
      if (!confirm('この保存アルバムを削除しますか？')) return;
      try {
        let history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
        history = history.filter(item => item.id !== id);
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        renderHistory();
      } catch (e) {
        console.error(e);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadCurrentDraft();
      renderHistory();

      const freeInput = document.getElementById('custom-free-label');
      if (freeInput) {
        freeInput.addEventListener('input', () => {
          saveCurrentDraft();
        });
      }
    });
  </script>
</body>
</html>

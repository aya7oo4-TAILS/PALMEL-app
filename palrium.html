<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PARMEL - PALRIUM</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@500;700&family=M+PLUS+Rounded+1c:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0b0d0e;
      --card-bg: linear-gradient(135deg, #24292e 0%, #16181b 100%);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-shadow: 0 12px 32px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      --avatar-bg: linear-gradient(135deg, rgba(255,255,255,0.3), rgba(255,255,255,0.05));
      --text-main: #f5f6f8;
      --text-sub: #9aa0a6;
      --gold: #e5c07b;
      --radius-card: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    
    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg-main);
      color: var(--text-main);
      font-family: 'Noto Sans JP', sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 12px 12px 80px;
    }

    .app-viewport {
      width: 100%;
      max-width: 414px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ヘッダー周り（タイトルとレイアウト切替ボタン） */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
      padding: 0 4px;
    }

    .page-title {
      font-family: 'Cinzel', serif;
      font-size: 0.9rem;
      letter-spacing: 0.2em;
      color: var(--gold);
    }

    /* レイアウト切り替えボタン群（2種類） */
    .layout-switcher {
      display: flex;
      gap: 4px;
      background: rgba(255, 255, 255, 0.05);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .layout-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      width: 26px;
      height: 26px;
      border-radius: 6px;
      font-size: 0.65rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, color 0.2s;
    }
    .layout-btn.active {
      background: rgba(229, 192, 123, 0.2);
      color: var(--gold);
    }

    /* 画面切り替え（ズーム＆フェード演出） */
    .view-screen {
      display: none;
      flex-direction: column;
      gap: 16px;
      opacity: 0;
      transform: scale(0.96);
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .view-screen.active {
      display: flex;
      opacity: 1;
      transform: scale(1);
    }

    /* 戻るボタン */
    .back-btn-header {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.7rem;
      cursor: pointer;
      align-self: flex-start;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: background 0.2s;
    }
    .back-btn-header:active { background: rgba(255, 255, 255, 0.2); }

    /* PALCARD一覧コンテナ */
    .pals-list-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: all 0.25s ease;
    }

    /* レイアウト1：1列でズラーッと並ぶ（デフォルト） */
    .pals-list-container.layout-1 {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* レイアウト2：2枚が横に並んで下にいくグリッド */
    .pals-list-container.layout-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .layout-2 .palcard {
      aspect-ratio: 1.35 / 1;
      padding: 8px 10px 10px;
      border-radius: 14px;
    }
    .layout-2 .palcard-brand { font-size: 0.48rem; letter-spacing: 0.2em; margin-bottom: 1px; }
    .layout-2 .user-title-display { font-size: 0.52rem; margin-top: 2px; margin-bottom: 1px; min-height: 0.6rem; }
    .layout-2 .pet-name { font-size: 1.05rem; margin-bottom: 2px; }
    .layout-2 .profile-fields { display: none; } /* 2列のときはすっきりさせるため詳細テキストは非表示 */
    .layout-2 .right-avatar-container { width: 58px; margin-top: 4px; }
    .layout-2 .avatar-wrapper { width: 54px; height: 54px; padding: 2px; }

    /* PALCARDデザイン（基本形） */
    .palcard {
      position: relative;
      width: 100%;
      aspect-ratio: 1.55 / 1;
      background: var(--card-bg);
      background-size: cover;
      background-position: center;
      border-radius: var(--radius-card);
      padding: 12px 14px 14px;
      box-shadow: var(--card-shadow);
      border: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s;
    }
    .palcard:active {
      transform: scale(0.96);
      border-color: rgba(229, 192, 123, 0.5);
    }

    .palcard-brand { font-family: 'Cinzel', serif; font-size: 0.65rem; letter-spacing: 0.35em; color: var(--text-sub); font-weight: 600; text-align: center; margin-bottom: 2px; }
    .palcard-body { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; flex: 1; width: 100%; }
    
    .profile-info { 
      flex: 1; 
      display: flex; 
      flex-direction: column; 
      min-width: 0; 
      justify-content: flex-start; 
      margin-top: 10px;
    }
    
    .user-title-display {
      font-size: 0.72rem;
      color: var(--gold);
      font-weight: 500;
      margin-top: 4px; 
      margin-bottom: 3px;
      letter-spacing: 0.05em;
      min-height: 0.9rem;
    }

    .pet-name { 
      font-family: 'Cinzel', 'Noto Sans JP', sans-serif; 
      font-size: 1.8rem; 
      line-height: 1.3; 
      margin-top: 0;   
      margin-bottom: 4px;  
      font-weight: 700; 
      color: #fff; 
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .profile-fields { display: flex; flex-direction: column; gap: 1px; margin-top: auto; width: 100%; }
    .field-row {
      position: relative;
      display: flex;
      align-items: center;
      padding-bottom: 2px;
      margin-bottom: 2px;
      padding-right: 8px;
    }
    .field-row::after {
      content: '';
      position: absolute; left: 0; bottom: 0; width: 95%;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .field-label { font-size: 0.52rem; color: var(--text-sub); width: 60px; flex-shrink: 0; }
    .field-value { color: var(--text-main); font-size: 0.6rem; font-weight: 500; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .right-avatar-container { 
      position: relative; width: 130px; flex-shrink: 0; 
      display: flex; align-items: flex-start; justify-content: center; margin-top: 12px; 
    }
    .avatar-wrapper { width: 124px; height: 124px; border-radius: 50%; padding: 3px; background: var(--avatar-bg); display: block; }
    .avatar-inner { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: #1a1d20; }
    .avatar-inner img { width: 100%; height: 100%; object-fit: cover; }

    /* 個別ホーム画面の9マスグリッド */
    .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; margin-top: 8px; }
    .grid-item { background: #15181b; border-radius: 10px; display: flex; flex-direction: column; aspect-ratio: 1 / 1.25; position: relative; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.08); }
    .grid-label { font-family: 'Cinzel', 'Noto Sans JP', serif; font-size: 0.54rem; letter-spacing: 0.08em; text-align: center; padding: 4px 2px; background: rgba(0, 0, 0, 0.5); color: var(--text-sub); }
    .grid-image-box { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
    .grid-image-box img { width: 100%; height: 100%; object-fit: cover; }
    
    .grid-item.palmel-item .grid-image-box img.has-image { filter: brightness(0.45); }
    .palmel-overlay-logo {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-family: 'Cinzel', serif; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.15em;
      color: rgba(255, 255, 255, 0.95); text-shadow: 0 0 10px rgba(229, 192, 123, 0.6); pointer-events: none;
    }

    /* ボトムナビゲーション */
    .bottom-nav {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 414px; height: 60px;
      background: rgba(15, 17, 20, 0.95); backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex; justify-content: space-around; align-items: center; z-index: 99999;
    }
    .nav-btn { background: none; border: none; color: var(--text-sub); display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 0.62rem; cursor: pointer; width: 25%; text-decoration: none; }
    .nav-btn.active { color: var(--gold); }
  </style>
</head>
<body>

    <!-- 画面1：一覧画面 -->
    <div class="view-screen active" id="screen-list">
      <div class="header-bar">
        <h1 class="page-title">PALRIUM</h1>
        <div class="layout-switcher">
          <button class="layout-btn active" id="l-btn-1" onclick="changeLayout(1)" title="1列リスト">☰</button>
          <button class="layout-btn" id="l-btn-2" onclick="changeLayout(2)" title="2列グリッド">⊞</button>
        </div>
      </div>
      
      <div class="pals-list-container layout-1" id="pals-list-container">
        <!-- PALCARDがここに並びます -->
      </div>
    </div>

    <!-- 画面2：個別ホーム画面（PALCARD ＋ 9マス） -->
    <div class="view-screen" id="screen-detail">
      <button class="back-btn-header" onclick="showListScreen()">← 一覧に戻る</button>
      <div id="detail-content-area">
        <!-- 選択されたカードと9マスがここに表示されます -->
      </div>
    </div>

  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-btn" id="btn-mypal">MYPAL</a>
    <a href="album.html" class="nav-btn" id="btn-album">ALBUM</a>
    <a href="palrium.html" class="nav-btn active" id="btn-exchange">PALRIUM</a>
    <a href="pals.html" class="nav-btn" id="btn-feed">PALS</a>
  </nav>

  <script>

      }
    ];

    let currentPalsData = [];
    let currentLayout = 1; // 1: 1列, 2: 2列

    // レイアウト切り替え関数
    window.changeLayout = function(layoutNum) {
      currentLayout = layoutNum;
      const container = document.getElementById('pals-list-container');
      
      container.className = `pals-list-container layout-${layoutNum}`;

      for (let i = 1; i <= 2; i++) {
        const btn = document.getElementById(`l-btn-${i}`);
        if (i === layoutNum) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      }
    };

    function loadExchangedPals() {
      // 強制的に今回の9枚のダミーデータをセットする（古い3枚データを上書き）
      currentPalsData = dummyPals;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(currentPalsData));

      const container = document.getElementById('pals-list-container');
      container.innerHTML = '';

      currentPalsData.forEach((pal, index) => {
        const itemBox = document.createElement('div');
        itemBox.style.display = 'flex';
        itemBox.style.flexDirection = 'column';

        itemBox.innerHTML = `
          <div class="palcard" onclick="openPalDetail(${index})">
            <div class="palcard-brand">PALCARD</div>
            <div class="palcard-body">
              <div class="profile-info">
                <div class="user-title-display">${pal.title || 'PAL'}</div>
                <div class="pet-name">${pal.name || 'ANONYMOUS'}</div>
                <div class="profile-fields">
                  <div class="field-row"><span class="field-label">生年月日</span><div class="field-value">${pal.birth || '-'}</div></div>
                  <div class="field-row"><span class="field-label">nickname</span><div class="field-value">${pal.nickname || '-'}</div></div>
                  <div class="field-row"><span class="field-label">message</span><div class="field-value">${pal.ownerMessage || '-'}</div></div>
                  <div class="field-row"><span class="field-label">pallike</span><div class="field-value" style="color:var(--gold); font-weight:bold;">♡ 交換済</div></div>
                </div>
              </div>
              
              <div class="right-avatar-container">
                <div class="avatar-wrapper">
                  <div class="avatar-inner"><img src="${pal.avatar || ''}"></div>
                </div>
              </div>
            </div>
          </div>
        `;

        container.appendChild(itemBox);
      });
    }

    // タップしたらズームインしながら個別ホーム画面へ切り替え
    window.openPalDetail = function(index) {
      const pal = currentPalsData[index];
      if (!pal) return;

      const detailArea = document.getElementById('detail-content-area');
      
      // 9マスのHTML生成
      let gridHtml = '';
      gridLabelsStatic.forEach((lbl, i) => {
        const labelText = (i === 2) ? (pal.freeLabel || 'FREE') : lbl;
        const isPalmel = (i === 8);
        const palmelClass = isPalmel ? ' palmel-item' : '';
        const palmelLogo = isPalmel ? `<div class="palmel-overlay-logo">PALMEL</div>` : '';
        const imgSrc = (pal.images && pal.images[i]) ? pal.images[i] : '';
        const imgTag = imgSrc ? `<img src="${imgSrc}" class="has-image">` : `<img src="">`;

        gridHtml += `
          <div class="grid-item${palmelClass}">
            <div class="grid-label">${labelText}</div>
            <div class="grid-image-box">
              ${imgTag}
              ${palmelLogo}
            </div>
          </div>
        `;
      });

      // PALCARD ＋ 9マスをセットで表示
      detailArea.innerHTML = `
        <div class="palcard" style="cursor: default; margin-bottom: 12px;" onclick="event.stopPropagation()">
          <div class="palcard-brand">PALCARD</div>
          <div class="palcard-body">
            <div class="profile-info">
              <div class="user-title-display">${pal.title || 'PAL'}</div>
              <div class="pet-name">${pal.name || 'ANONYMOUS'}</div>
              <div class="profile-fields">
                <div class="field-row"><span class="field-label">生年月日</span><div class="field-value">${pal.birth || '-'}</div></div>
                <div class="field-row"><span class="field-label">nickname</span><div class="field-value">${pal.nickname || '-'}</div></div>
                <div class="field-row"><span class="field-label">message</span><div class="field-value">${pal.ownerMessage || '-'}</div></div>
                <div class="field-row"><span class="field-label">owner</span><div class="field-value" style="color:var(--gold);">${pal.ownerName || '-'}</div></div>
              </div>
            </div>
            <div class="right-avatar-container">
              <div class="avatar-wrapper">
                <div class="avatar-inner"><img src="${pal.avatar || ''}"></div>

            </div>
          </div>

        <div style="font-family:'Cinzel',serif; font-size:0.75rem; color:var(--gold); letter-spacing:0.15em; margin-top:4px;">9PALS ALBUM</div>
        <div class="grid-container">
          ${gridHtml}
        </div>
      `;

      // 画面切り替え
      document.getElementById('screen-list').classList.remove('active');
      document.getElementById('screen-detail').classList.add('active');
      window.scrollTo(0, 0);
    };

    // 一覧画面に戻る
    window.showListScreen = function() {
      document.getElementById('screen-detail').classList.remove('active');
      document.getElementById('screen-list').classList.add('active');
      window.scrollTo(0, 0);
    };

    window.addEventListener('DOMContentLoaded', () => {
      loadExchangedPals();
    });
  </script>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>PALMEL</title>

  <link rel="stylesheet" href="css/base.css">

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>

  <!-- =========================
       サイドメニュー
  ========================== -->

  <div id="drawer-overlay" class="drawer-overlay"></div>

  <aside id="side-drawer" class="side-drawer">

    <div>
      <div class="drawer-header">
        <span class="drawer-title">SETTINGS</span>

        <button
          class="drawer-close-btn"
          onclick="closeDrawer()">
          ✕
        </button>
      </div>

      <div class="drawer-menu-list">

        <button
          class="drawer-item"
          onclick="openAccountSettings()">
          👤 プロフ設定
        </button>

        <a
          href="customize.html"
          class="drawer-item">
          🎨 デザイン着せ替え
        </a>

      </div>
    </div>

    <button
      class="drawer-item drawer-logout"
      onclick="logout()">
      🚪 ログアウト
    </button>

  </aside>


  <!-- =========================
       PALMEL HOME
  ========================== -->

  <main class="app-viewport">

    <section id="page-mypal" class="page active">

      <!-- =====================
           PALCARD
      ====================== -->

      <div
        class="palcard-container"
        id="palcard-container"
        onclick="toggleCardFlip(event)">

        <div class="palcard-flipper">


          <!-- ===== 表面 ===== -->

          <div class="palcard" id="main-palcard">

            <div class="palcard-brand">
              PALCARD
            </div>


            <div class="palcard-body">

              <!-- プロフィール表示 -->

              <div class="profile-info">

                <div
                  id="in-user-title"
                  class="user-title-input">
                  FOUNDER
                </div>

                <div
                  id="in-name"
                  class="pet-name">
                  プロフ設定から入力
                </div>


                <div class="profile-fields">

                  <div class="field-row">
                    <span class="field-label">
                      生年月日
                    </span>

                    <span
                      id="in-birth"
                      class="field-input">
                      プロフ設定から入力
                    </span>
                  </div>


                  <div class="field-row">
                    <span class="field-label">
                      ニックネーム
                    </span>

                    <span
                      id="in-nickname"
                      class="field-input">
                      プロフ設定から入力
                    </span>
                  </div>


                  <div class="field-row">
                    <span class="field-label">
                      pallike
                    </span>

                    <span
                      class="field-input"
                      id="in-pallike">
                      ♡ 0
                    </span>
                  </div>

                </div>

              </div>


              <!-- ===== アバター ===== -->

              <div class="right-avatar-container">

                <label
                  class="avatar-wrapper"
                  id="main-avatar-wrapper"
                  onclick="event.stopPropagation()">

                  <div class="avatar-inner">

                    <img
                      id="avatar-img"
                      src="">

                  </div>

                  <input
                    type="file"
                    accept="image/*"
                    onchange="previewImg(this, 'avatar-img')">

                </label>


                <div
                  class="present-pet-name"
                  id="present-pet-name-display"
                  style="display:none;">
                  プロフ設定から入力
                </div>

              </div>

            </div>


            <!-- ===== カード下部 ===== -->

            <div
              class="palcard-footer"
              id="main-palcard-footer">

              <div class="footer-left-group">

                <button
                  class="icon-btn"
                  onclick="event.stopPropagation(); presentCard();">
                  名刺を渡す
                </button>


                <label
                  class="icon-btn"
                  onclick="event.stopPropagation()">

                  名刺を受け取る

                  <input
                    type="file"
                    accept="image/*"
                    capture="environment"
                    onchange="receiveNewCard(this)">

                </label>

              </div>


              <!-- SNS -->

              <div class="sns-links-container">

                <a
                  id="btn-sns-instagram"
                  href="#"
                  target="_blank"
                  class="sns-btn"
                  onclick="event.stopPropagation()">
                  📸
                </a>

                <a
                  id="btn-sns-x"
                  href="#"
                  target="_blank"
                  class="sns-btn"
                  onclick="event.stopPropagation()">
                  𝕏
                </a>

              </div>

            </div>

          </div>


          <!-- ===== 裏面 ===== -->

          <div
            class="palcard palcard-back"
            id="back-palcard">

            <div class="palcard-brand">
              PALCARD
            </div>


            <div class="back-content">

              <div>

                <div class="back-owner-title">
                  MESSAGE
                </div>

                <div
                  class="back-owner-name"
                  id="back-message-display">
                  プロフ設定から入力
                </div>

              </div>


              <div class="back-sns-list">

                <a
                  id="back-btn-instagram"
                  href="#"
                  target="_blank"
                  class="back-sns-item inactive">
                  📸 Instagramを開く
                </a>

                <a
                  id="back-btn-x"
                  href="#"
                  target="_blank"
                  class="back-sns-item inactive">
                  𝕏 (Twitter) を開く
                </a>

              </div>

            </div>


            <div class="back-flip-tip">
              もう一度タップして表面に戻る
            </div>

          </div>

        </div>

      </div>


      <!-- =========================
           9 GRID
      ========================== -->

      <div class="grid-container">


        <!-- 1 -->

        <div class="grid-item">

          <div class="grid-label">
            MONTHLY
          </div>

          <label class="grid-image-box">

            <img id="g0">

            <input
              type="file"
              accept="image/*"
              onchange="previewGrid(this, 'g0')">

          </label>

        </div>


        <!-- 2 -->

        <div class="grid-item">

          <div class="grid-label">
            CHARMPOINT
          </div>

          <label class="grid-image-box">

            <img id="g1">

            <input
              type="file"
              accept="image/*"
              onchange="previewGrid(this, 'g1')">

          </label>

        </div>


        <!-- 3 -->

        <div class="grid-item">

          <div class="grid-label">

            <input
              type="text"
              id="custom-free-label"
              class="grid-label-input"
              value="FREE"
              placeholder="タイトル"
              maxlength="12">

          </div>

          <label class="grid-image-box">

            <img id="g2">

            <input
              type="file"
              accept="image/*"
              onchange="previewGrid(this, 'g2')">

          </label>

        </div>


        <!-- 4 -->

        <div class="grid-item">

          <div class="grid-label">
            FOOD
          </div>

          <label class="grid-image-box">

            <img id="g3">

            <input
              type="file"
              accept="image/*"
              onchange="previewGrid(this, 'g3')">

          </label>

        </div>


        <!-- 5 -->

        <div class="grid-item">

          <div class="grid-label">
            MAIN
          </div>

          <label class="grid-image-box">

            <img id="g4">

            <input
              type="file"
              accept="image/*"
              onchange="previewGrid(this, 'g4')">

          </label>

        </div>


        <!-- 6 -->

        <div class="grid-item">

          <div class="grid-label">
            SLEEPING
          </div>

          <label class="grid-image-box">

            <img id="g5">

            <input
              type="file"
              accept="image/*"
              onchange="previewGrid(this, 'g5')">

          </label>

        </div>


        <!-- 7 -->

        <div class="grid-item">

          <div class="grid-label">
            TOYS
          </div>

          <label class="grid-image-box">

            <img id="g6">

            <input
              type="file"
              accept="image/*"
              onchange="previewGrid(this, 'g6')">

          </label>

        </div>


        <!-- 8 -->

        <div class="grid-item">

          <div class="grid-label">
            FUNNYSHOT
          </div>

          <label class="grid-image-box">

            <img id="g7">

            <input
              type="file"
              accept="image/*"
              onchange="previewGrid(this, 'g7')">

          </label>

        </div>


        <!-- 9 -->

        <div class="grid-item">

          <div class="grid-label">
            PALMEL
          </div>

          <div class="grid-number-box">

            <span class="styled-number">
              9
            </span>

          </div>

        </div>

      </div>

    </section>

  </main>


  <!-- =========================
       名刺を渡す
  ========================== -->

  <div
    id="card-present-modal"
    class="card-present-overlay"
    onclick="closePresentCard()">

    <div
      class="card-present-wrapper"
      id="present-card-container">
    </div>

    <div class="card-present-tip">
      タップして閉じる
    </div>

  </div>


  <!-- =========================
       プロフ設定
  ========================== -->

  <div
    id="account-modal"
    class="modal-overlay">

    <div class="modal-content">

      <h3>
        PROFILE SETTINGS
      </h3>


      <!-- ペット名 -->

      <div class="form-group">

        <label class="form-label">
          ペット名
        </label>

        <input
          type="text"
          id="acc-pet-name"
          class="form-input"
          placeholder="ペットの名前を入力">

      </div>


      <!-- 肩書き -->

      <div class="form-group">

        <label class="form-label">
          肩書き
        </label>

        <input
          type="text"
          id="acc-user-title"
          class="form-input"
          placeholder="例：FOUNDER">

      </div>


      <!-- 生年月日 -->

      <div class="form-group">

        <label class="form-label">
          生年月日
        </label>

        <input
          type="text"
          id="acc-birth"
          class="form-input"
          placeholder="YYYY.MM.DD">

      </div>


      <!-- ニックネーム -->

      <div class="form-group">

        <label class="form-label">
          ニックネーム
        </label>

        <input
          type="text"
          id="acc-nickname"
          class="form-input"
          placeholder="ニックネームを入力">

      </div>


      <!-- 一言メッセージ -->

      <div class="form-group">

        <label class="form-label">
          一言メッセージ
        </label>

        <input
          type="text"
          id="acc-message"
          class="form-input"
          placeholder="ひとこと入力"
          maxlength="60">

      </div>


      <!-- Instagram -->

      <div class="form-group">

        <label class="form-label">
          Instagram ID
        </label>

        <input
          type="text"
          id="acc-instagram"
          class="form-input"
          placeholder="ユーザー名を入力">

      </div>


      <!-- X -->

      <div class="form-group">

        <label class="form-label">
          X (Twitter) ID
        </label>

        <input
          type="text"
          id="acc-x"
          class="form-input"
          placeholder="ユーザー名を入力">

      </div>


      <button
        class="action-btn-main"
        onclick="saveAccountSettings()">
        保存する
      </button>

    </div>

  </div>


  <!-- =========================
       ボトムナビ
  ========================== -->

  <nav class="bottom-nav">

    <a
      class="nav-btn active"
      href="index.html">
      🏠
      <span>マイパル</span>
    </a>


    <a
      class="nav-btn"
      href="pages/album.html">
      📖
      <span>アルバム</span>
    </a>


    <a
      class="nav-btn"
      href="pages/exchange.html">
      🎴
      <span>名刺/9マス</span>
    </a>


    <a
      class="nav-btn"
      href="pages/pals.html">
      🐾
      <span>みんなのパル</span>
    </a>

  </nav>


  <script src="js/app.js"></script>

</body>
</html>
